<!DOCTYPE html><html><head><title>chart 2.9.4</title>
<script src="../vendor/chart-2.9.4.min.js"></script><style type="text/css">/* Chart.js */
@keyframes chartjs-render-animation{from{opacity:.99}to{opacity:1}}.chartjs-render-monitor{animation:chartjs-render-animation 1ms}.chartjs-size-monitor,.chartjs-size-monitor-expand,.chartjs-size-monitor-shrink{position:absolute;direction:ltr;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;visibility:hidden;z-index:-1}.chartjs-size-monitor-expand>div{position:absolute;width:1000000px;height:1000000px;left:0;top:0}.chartjs-size-monitor-shrink>div{position:absolute;width:200%;height:200%;left:0;top:0}</style></head>
<body><div style="width:600px"><canvas id="c" width="600" height="300" style="display: block;"></canvas></div>
<script>
var ctx = document.getElementById('c').getContext('2d');
console.log('getContext(2d) ->', ctx === null ? 'null' : typeof ctx);
try {
  var chart = new Chart(document.getElementById('c'), {
    type: 'bar',
    data: { labels: ['Q1', 'Q2', 'Q3', 'Q4'], datasets: [{ label: 'Revenue', data: [12, 19, 3, 5] }] },
    options: { animation: false, responsive: false }
  });
  window.status = chart.ctx ? 'chart-ok' : 'chart-no-context';
} catch (e) {
  console.log('Chart failed: ' + e);
  window.status = 'chart-failed';
}
</script>

</body></html>
