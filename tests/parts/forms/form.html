<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Form</title></head>
<body style="font-family:'DejaVu Sans'">
<h1>Form</h1>
<form>
<p>Text: <input type="text" name="fullname" value="Jane Doe" maxlength="20"></p>
<p>Empty text: <input type="text" name="empty"></p>
<p>Password: <input type="password" name="secret" value="hunter2"></p>
<p>Read-only: <input type="text" name="ro" value="fixed" readonly></p>
<p>Untyped: <input name="untyped" value="default type"></p>
<p>Area: <textarea name="comments" rows="3" cols="30">Line one
Line two</textarea></p>
<p>Checked: <input type="checkbox" name="agree" checked> Unchecked: <input type="checkbox" name="news"></p>
<p>Radio: <input type="radio" name="color" value="r" checked> red <input type="radio" name="color" value="g"> green</p>
<p>Select: <select name="size"><option>S</option><option selected>M</option><option>L</option></select></p>
<p><input type="submit" value="Send"></p>
</form></body></html>
