<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>window.print()</title>
<style>body { font-family: 'DejaVu Sans'; font-size: 11pt; }</style>
</head>
<body>
<h1>window.print() ends the wait</h1>
<p id="a">Before the script.</p>
<script>
document.getElementById('a').textContent = 'The script ran.';
window.onload = function () {
  document.body.appendChild(document.createElement('p')).textContent = 'The load handler ran and called print().';
  window.print();
};
</script>
</body></html>
