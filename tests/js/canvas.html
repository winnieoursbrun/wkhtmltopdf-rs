<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Canvas 2D</title></head>
<body style="font-family:'DejaVu Sans'">
<p>Canvas 2D features</p>
<img id="img" width="16" height="16" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFklEQVR4nGP4zwAE/yEkgvUfysUqAwCeow/x34oU2QAAAABJRU5ErkJggg==">
<canvas id="c" width="400" height="300" style="border:1px solid #999"></canvas>
<script>
var c = document.getElementById('c'), ctx = c.getContext('2d');
var g = ctx.createLinearGradient(0, 0, 200, 0);
g.addColorStop(0, 'red'); g.addColorStop(1, 'blue');
ctx.fillStyle = g; ctx.fillRect(10, 10, 180, 40);
var r = ctx.createRadialGradient(300, 60, 5, 300, 60, 50);
r.addColorStop(0, '#ffff00'); r.addColorStop(1, 'rgba(0,128,0,0.8)');
ctx.fillStyle = r; ctx.beginPath(); ctx.arc(300, 60, 50, 0, Math.PI * 2); ctx.fill();
ctx.strokeStyle = '#333'; ctx.lineWidth = 6; ctx.lineCap = 'round';
ctx.beginPath(); ctx.arc(80, 140, 40, 0, Math.PI * 1.5); ctx.stroke();
ctx.setLineDash([10, 5]); ctx.lineWidth = 2; ctx.strokeStyle = 'purple';
ctx.beginPath(); ctx.moveTo(150, 100); ctx.bezierCurveTo(200, 50, 250, 200, 390, 120); ctx.stroke();
ctx.setLineDash([]);
ctx.save(); ctx.translate(200, 230); ctx.rotate(-Math.PI / 12);
ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = 'darkred'; ctx.textAlign = 'center';
ctx.fillText('Rotated text', 0, 0); ctx.restore();
ctx.save(); ctx.beginPath(); ctx.rect(20, 200, 100, 80); ctx.clip();
ctx.globalAlpha = 0.5; ctx.fillStyle = 'orange';
ctx.beginPath(); ctx.arc(70, 240, 60, 0, Math.PI * 2); ctx.fill(); ctx.restore();
ctx.drawImage(document.getElementById('img'), 330, 220, 48, 48);
ctx.strokeStyle = 'black'; ctx.lineWidth = 1; ctx.strokeRect(330.5, 220.5, 48, 48);
ctx.font = '12px serif'; ctx.fillStyle = '#000'; ctx.textBaseline = 'top';
ctx.fillText('top-left', 5, 285);
</script>
<p>After the canvas</p>
</body></html>
