<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chart.js 2.9.4 bar chart</title>
<script src="vendor/chart-2.9.4.min.js"></script>
<style>body { font-family: 'DejaVu Sans'; font-size: 11pt; }</style>
</head>
<body>
<h1>Quarterly revenue</h1>
<p>A bar chart drawn by Chart.js 2.9.4 on a canvas, without animation.</p>
<canvas id="chart" width="600" height="300"></canvas>
<p id="status">chart not drawn</p>
<script>
var ctx = document.getElementById('chart').getContext('2d');
var chart = new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['Q1', 'Q2', 'Q3', 'Q4'],
    datasets: [
      { label: '2025', data: [12, 19, 7, 15], backgroundColor: 'rgba(54, 162, 235, 0.6)', borderColor: 'rgb(54, 162, 235)', borderWidth: 1 },
      { label: '2026', data: [14, 11, 16, 21], backgroundColor: 'rgba(255, 99, 132, 0.6)', borderColor: 'rgb(255, 99, 132)', borderWidth: 1 }
    ]
  },
  options: {
    responsive: false,
    animation: false,
    title: { display: true, text: 'Revenue (k€)' },
    scales: { yAxes: [{ ticks: { beginAtZero: true } }] }
  }
});
document.getElementById('status').textContent = 'chart drawn: ' + chart.data.datasets.length + ' datasets, ' + chart.data.labels.length + ' labels';
</script>
<p>Text after the chart.</p>
</body></html>
