[package]
name = "wkhtmltopdf"
description = "Pure-Rust drop-in replacement for wkhtmltopdf 0.12.6 (port of src/pdf)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "wkhtmltopdf_app"
path = "src/lib.rs"

[[bin]]
name = "wkhtmltopdf"
path = "src/main.rs"

# In-process throughput harness for bench/java/ (not shipped).
[[bin]]
name = "wkhtmltopdf-inproc"
path = "src/bin/wkhtmltopdf-inproc.rs"
required-features = ["bench-inproc"]

[dependencies]
wk-cli.workspace = true
wk-settings.workspace = true
wk-converter.workspace = true
wk-loader.workspace = true
rayon = "1.10"
# Heap profiler, only with `--features dhat-heap` (docs/perf.md).
dhat = { version = "0.3", optional = true }

# The allocator of the static musl build (src/alloc.rs), compiled and tested on every Unix.
[target.'cfg(unix)'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
libc = "0.2"

[features]
dhat-heap = ["dep:dhat"]
# dlmalloc as it is (one lock) as the global allocator, instead of `alloc::WkAlloc` on musl.
dlmalloc = []
# The C library's allocator on musl too (for comparisons).
system-alloc = []
bench-inproc = []

[dev-dependencies]
pdf-extract = "0.12"
lopdf = "0.42"
hayro = "0.8.0"
image.workspace = true
url.workspace = true
