[workspace]
resolver = "3"
members = [
    "crates/wkhtmltopdf",
    "crates/wk-cli",
    "crates/wk-settings",
    "crates/wk-fonts",
    "crates/wk-loader",
    "crates/wk-webkit",
    "crates/wk-js",
    "crates/wk-print",
    "crates/wk-converter",
]
exclude = ["vendor/stylo", "vendor/blitz-dom", "vendor/stylo_taffy", "vendor/taffy", "vendor/blitz-paint", "vendor/parley", "vendor/parley_engine", "vendor/krilla", "vendor/boa_engine", "spikes"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
wk-cli = { path = "crates/wk-cli" }
wk-settings = { path = "crates/wk-settings" }
wk-fonts = { path = "crates/wk-fonts" }
wk-loader = { path = "crates/wk-loader" }
wk-webkit = { path = "crates/wk-webkit" }
wk-js = { path = "crates/wk-js" }
wk-print = { path = "crates/wk-print" }
wk-converter = { path = "crates/wk-converter" }

# Engine stack (versions validated by spikes/static-render).
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["woff", "floats", "svg"] }
blitz-html = { version = "=0.3.0-beta.3" }
blitz-traits = { version = "=0.3.0-beta.3" }
blitz-paint = { version = "=0.3.0-beta.3", default-features = false, features = ["svg"] }
stylo = { version = "0.22" }
parley = { version = "0.12", default-features = false, features = ["std"] }
anyrender = { version = "0.14" }
peniko = { version = "0.6" }
kurbo = { version = "0.13" }
skrifa = { version = "0.44" }
krilla = { version = "0.8.2" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = { version = "2" }
data-url = { version = "0.3" }
encoding_rs = { version = "0.8" }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "socks-proxy"] }
base64 = { version = "0.22" }
# JavaScript (versions validated by spikes/js-dom): no Intl/Temporal, like QtWebKit 2.2.
boa_engine = { version = "0.22", default-features = false, features = ["annex-b"] }
boa_gc = { version = "0.22" }
html5ever = { version = "0.40" }

[patch.crates-io]
# Servo-mode stylo with page-break-*/break-* enabled (vendor/stylo/properties/*.toml).
stylo = { path = "vendor/stylo" }
# blitz-paint publishing the source text of glyph runs (vendor/blitz-paint/src/run_text.rs).
blitz-paint = { path = "vendor/blitz-paint" }
# blitz-dom with QtWebKit 2.2 tables (auto layout in layout/table_auto.rs, collapsed borders in
# layout/table.rs), font sizes and line heights (stylo_to_parley.rs).
blitz-dom = { path = "vendor/blitz-dom" }
# stylo_taffy with WebKit's whole-pixel lengths (convert.rs) and collapsed-cell border overrides (wrapper.rs).
stylo_taffy = { path = "vendor/stylo_taffy" }
# taffy with BFC roots containing floats above their bottom padding and border (vendor/taffy/src/compute/block.rs).
taffy = { path = "vendor/taffy" }
# parley with QtWebKit's line-height: normal (ascent and descent rounded up, vendor/parley/src/style/mod.rs).
parley = { path = "vendor/parley" }
# parley_engine with QtWebKit's linear glyph advances (vendor/parley_engine/src/shape/shaped_text.rs).
parley_engine = { path = "vendor/parley_engine" }
# boa_engine with Script::with_realm, so the DOM prelude is parsed and compiled once per
# thread and evaluated in each page's realm (vendor/boa_engine/src/script.rs).
boa_engine = { path = "vendor/boa_engine" }
# krilla writing the hhea ascent/descent in font descriptors, as Qt does (vendor/krilla/src/text/font.rs).
krilla = { path = "vendor/krilla" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Disk is scarce on the development machine: no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# The L3 corpus test rasterises ~50 pages with hayro: optimise the rasteriser in test builds.
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.hayro]
opt-level = 3
[profile.dev.package.hayro-interpret]
opt-level = 3
[profile.dev.package.hayro-syntax]
opt-level = 3
